services:
  rainflow:
    build: .
    image: rainflow-backend:latest
    container_name: rainflow-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DB_PATH: /data/rainflow.db
    volumes:
      - rainflow-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  rainflow-data:
    driver: local
